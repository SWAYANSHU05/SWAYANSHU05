name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: SWAYANSHU05
          outputs: |
            "dist/github-snake.svg?color_snake=%2300E5FF&color_dots=%23161B22,%230B3D3E,%23087F5B,%2300BFA5,%2300E676"
            "dist/github-snake-dark.svg?color_snake=%2300E5FF&color_dots=%23161B22,%230B3D3E,%23087F5B,%2300BFA5,%2300E676"

      - name: Publish Snake
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
